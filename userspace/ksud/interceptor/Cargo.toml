[workspace]

[package]
name = "interceptor"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
# 使用纯 Rust 的 Android Inline Hook 实现，替换掉不兼容的 retour
cydia-substrate-rs = { git = "https://github.com/rodroidmods/cydia-substrate-rs" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
