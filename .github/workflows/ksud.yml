name: Build ksud
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      pack_lkm:
        required: false
        type: boolean
        default: false
      pack_ksuinit:
        required: false
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download artifacts
      uses: actions/download-artifact@v8
    
    - name: Prepare ksuinit
      if: ${{ inputs.pack_ksuinit }}
      run: |
        mv ksuinit-aarch64/ksuinit ./userspace/ksud/bin/aarch64/
        
    - name: Setup rustup
      run: |
        rustup update stable
        rustup target add ${{ inputs.target }}

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          userspace/ksud
          userspace/ksud/interceptor
        cache-targets: false

    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r29

    - name: Build interceptor
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        source .github/scripts/setup-rust-build.sh ${{ inputs.target }} 26
        
        # 强制静态链接 C 运行时，生成无依赖的 so
        export RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-Wl,-z,max-page-size=16384"
        
        # 编译 interceptor
        cargo build --target "$TRIPLE" --release --manifest-path ./userspace/ksud/interceptor/Cargo.toml

    - name: Copy interceptor lib
      run: |
        mkdir -p ./userspace/ksud/bin/aarch64/
        
        # 查找生成的 libinterceptor.so（因为在独立 workspace 下编译，产物路径可能不同）
        SO_PATH=$(find userspace/ksud/interceptor/target/${{ inputs.target }}/release -name "libinterceptor.so" | head -n 1)
        
        if [ -z "$SO_PATH" ]; then
          echo "ERROR: libinterceptor.so not found"
          find userspace/ksud/interceptor/target -name "*.so" || true
          exit 1
        fi
        
        cp "$SO_PATH" ./userspace/ksud/bin/aarch64/libinterceptor.so
        echo "Copied from $SO_PATH"

    - name: Build ksud
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          export KSU_PACKAGE_NAME="me.weishu.kernelsu.pr"
        fi
        source .github/scripts/setup-rust-build.sh ${{ inputs.target }} 26
        
        # ksud 不需要静态链接，不需要设置 RUSTFLAGS
        cargo build --target "$TRIPLE" --release --manifest-path ./userspace/ksud/Cargo.toml

    - name: Upload ksud artifact
      uses: actions/upload-artifact@v7
      with:
        name: ksud-${{ inputs.target }}
        path: target/${{ inputs.target }}/release/ksud
